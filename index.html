<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agenda für den Workshop Linux Fundamentals" />
    <script>
      // Design vor dem ersten Rendern setzen, damit nichts aufblitzt.
      // Gespeicherte Wahl (siehe src/lib/theme.ts), sonst die Systemeinstellung.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('linux-fundamentals-theme') ??
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Linux Fundamentals — Agenda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
